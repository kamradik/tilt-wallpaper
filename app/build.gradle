plugins { id 'com.android.application' }

// Local key so builds update an installed copy; the published release key never enters the repository.
def keystore = rootProject.file(findProperty('tilt.keystore') ?: '.tools/personal-debug.jks')

android {
    namespace 'dev.solotilt.personal'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.solotilt.personal'
        minSdk 30
        targetSdk 36
        versionCode 5
        versionName '2.0-beta5'
    }
    signingConfigs {
        local {
            storeFile keystore
            storePassword findProperty('tilt.storePassword') ?: 'android'
            keyAlias findProperty('tilt.keyAlias') ?: 'personal'
            keyPassword findProperty('tilt.keyPassword') ?: 'android'
        }
    }
    buildTypes {
        debug { if (keystore.exists()) signingConfig signingConfigs.local }
        release {
            minifyEnabled false
            if (keystore.exists()) signingConfig signingConfigs.local
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android supplies org.json at runtime; host-side tests need a real implementation.
    testImplementation 'org.json:json:20250517'
}

// ---- Instrumented UI smoke tests (androidTest only; nothing here reaches the app APK) ----
// No androidx.test: the project runs with android.useAndroidX=false (and lint resolves the androidTest classpath), so
// SmokeRunner is a plain Instrumentation that drives the UI through UiAutomation and reports in the `am instrument`
// format Gradle parses.
android {
    defaultConfig { testInstrumentationRunner 'dev.solotilt.personal.SmokeRunner' }
}
// SmokeRunner saves screenshots in the app's external files; this copies them to build/screenshots after a connected run.
tasks.register('pullScreenshots', Exec) {
    def out = rootProject.layout.buildDirectory.dir('screenshots').get().asFile
    doFirst { out.mkdirs() }
    commandLine android.adbExecutable.absolutePath, 'pull', '/sdcard/Android/data/dev.solotilt.personal/files/screenshots/.', out.absolutePath
    ignoreExitValue true
}
tasks.matching { it.name == 'connectedDebugAndroidTest' }.configureEach { finalizedBy 'pullScreenshots' }
