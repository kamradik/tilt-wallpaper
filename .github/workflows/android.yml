# Build, unit tests, lint and shader checks on every push; UI smoke tests with screenshots on a KVM emulator.
# The emulator job is what local development can't do on a machine with virtualization disabled.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug build, lint
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Lint must report no errors
        run: '! grep -q ": Error:" app/build/reports/lint-results-debug.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Shader check (every effect compiles and renders in WebGL2)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/fx-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tilt-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          retention-days: 14

  ui-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke tests on a Pixel-sized emulator (screenshots in build/screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash ci/ui-tests.sh
      - name: Report UI test results as annotations
        if: always()
        run: python3 ci/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            build/screenshots/
            app/build/reports/androidTests/
            ui-tests.log
            logcat.txt
          retention-days: 14
